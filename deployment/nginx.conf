events {}

http {
  # Docker's embedded DNS, so upstream containers can be restarted independently.
  resolver 127.0.0.11 valid=30s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  client_max_body_size 2m;
  server_tokens off;

  # Per-client request limits at the edge (the API also limits per client).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

  # Plain HTTP for local use. On a public host, terminate TLS in front of this
  # (see README "Production checklist") — tokens must never travel over HTTP.
  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /auth/ {
      limit_req zone=auth burst=10 nodelay;
      set $backend http://backend:8000;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;           # overwritten: clients cannot spoof it
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|docs|redoc|openapi.json|health) {
      limit_req zone=api burst=40 nodelay;
      set $backend http://backend:8000;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;  # backtests can take a while
    }

    location /ws/ {
      set $backend http://backend:8000;
      proxy_pass $backend;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location / {
      set $frontend http://frontend:3000;
      proxy_pass $frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
