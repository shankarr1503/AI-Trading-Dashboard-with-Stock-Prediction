# Full stack: Postgres, Redis, API, trading-bot runner, ML service, frontend, nginx.
# Open http://localhost after `docker compose up --build`.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-trading_platform}
  REDIS_URL: redis://redis:6379/0
  ML_SERVICE_URL: http://ml_service:8001
  DB_AUTO_CREATE: "false"
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_user} -d ${POSTGRES_DB:-trading_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers"

  # Exactly one process drives the trading bot (a DB lease also prevents doubles).
  bot:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    command: python -m backend.trading.runner
    healthcheck:
      disable: true

  ml_service:
    build:
      context: .
      dockerfile: deployment/Dockerfile.ml
    restart: unless-stopped
    env_file: .env
    environment:
      MODEL_SAVE_DIR: /app/ml/saved_models
    volumes:
      - ml_models:/app/ml/saved_models

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL:-http://localhost}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  ml_models:

networks:
  default:
    name: trading_network
