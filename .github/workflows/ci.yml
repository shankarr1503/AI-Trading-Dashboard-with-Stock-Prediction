name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_trading
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Unit, integration and API tests (offline, synthetic data)
        run: python -m pytest -q
      - name: Migrations apply cleanly on PostgreSQL (up, down, up)
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_trading
        run: |
          alembic upgrade head
          alembic check            # models and migrations must not drift
          alembic downgrade base
          alembic upgrade head

  ml:
    name: ML tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The heavy optional stack (TensorFlow, transformers) is not needed for these tests.
      - run: pip install -r backend/requirements-dev.txt "scikit-learn>=1.5,<1.7" "xgboost>=2.1,<3.1" "statsmodels>=0.14.4"
      - run: python -m pytest -q tests/test_ml.py

  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost
          NEXT_PUBLIC_WS_URL: ws://localhost
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [backend, ml, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: backend, file: deployment/Dockerfile.backend }
          - { name: ml, file: deployment/Dockerfile.ml }
          - { name: frontend, file: deployment/Dockerfile.frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    # Opt in by setting the repository variable DEPLOY_ENABLED=true and the PROD_* secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/ai-trading-platform
            git pull --ff-only origin main
            docker compose up -d --build --remove-orphans
            docker image prune -f
